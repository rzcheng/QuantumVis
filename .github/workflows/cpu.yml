name: CPU correctness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - run: python examples/bell_state.py
      - run: python examples/ghz_state.py
      - run: python -m benchmarks.benchmark_gates --qubits 8 --operations H --warmups 1 --repetitions 3 --output /tmp/quantumvis-cpu-smoke.json
      - run: python -m build --no-isolation

  external-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation -e '.[verification]'
      - run: python -m pip check
      - run: python -c "import qiskit; print('Qiskit', qiskit.__version__)"
      - run: python -m pytest -q tests/test_qiskit_reference.py --junitxml=validation/results/qiskit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qiskit-reference-results
          path: validation/results/qiskit.xml
          if-no-files-found: error
