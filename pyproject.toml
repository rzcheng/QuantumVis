[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "quantaforge"
version = "0.1.0"
description = "A correctness-first quantum state-vector simulator with a planned Triton backend"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Ryan Cheng"}]
dependencies = ["numpy>=2.0,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "gpu: requires an explicitly detected compatible GPU runtime",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
